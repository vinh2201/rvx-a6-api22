name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        # clean first so stale outputs are removed
        run: ./gradlew clean :patches:buildAndroid

      - name: Upload Patches Artifact
        uses: actions/upload-artifact@v4
        with:
          name: revanced-patches-output
          # Collect the .rvp from patches/build/libs
          path: |
            patches/build/libs/patches-*.rvp